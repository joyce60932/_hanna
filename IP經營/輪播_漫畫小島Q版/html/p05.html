const EL=[...document.querySelectorAll('[data-a],[data-l]')];
const c=x=>Math.max(0,Math.min(1,x)), eo=p=>1-Math.pow(1-p,3), bo=p=>{p=c(p);const k=1.9;return 1+(k+1)*Math.pow(p-1,3)+k*Math.pow(p-1,2)};
