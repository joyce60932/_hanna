<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Mrs+Saint+Delafield&display=block" rel="stylesheet">
<style>
  :root { --bg: #e9e9e9; --ink: #1c1c1c; --soft: #555; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #999; font-family: "Noto Serif TC", serif; color: var(--ink); }
  .slide {
    width: 1080px; height: 1350px; background: var(--bg);
    position: relative; overflow: hidden; margin: 0 0 20px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 190px 96px 130px;
  }
  .series {
    position: absolute; top: 100px; left: 96px;
    display: flex; align-items: center; gap: 24px;
    font-size: 24px; letter-spacing: 0.28em; color: var(--soft);
  }
  .series::after { content: ""; width: 140px; height: 1px; background: var(--soft); }
  .person {
    position: absolute; right: 0; bottom: 0; width: 430px; height: 520px;
    background: url(person.png) center top / 100% auto no-repeat;
  }
  .who { position: absolute; left: 96px; bottom: 330px; }
  .who::before { content: ""; display: block; width: 72px; height: 1px; background: var(--ink); margin-bottom: 28px; }
  .who .en { font-size: 34px; letter-spacing: 0.12em; margin-bottom: 12px; }
  .who .zh { font-size: 26px; letter-spacing: 0.16em; color: var(--soft); }
  .save { margin-top: 1.2em; padding-top: 1.1em; border-top: 1px solid #b5b5b5; }
  .save .t { display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 1.1em; margin-bottom: 0.5em; }
  .save svg { width: 1em; height: 1.2em; }
  .sign {
    position: absolute; left: 70px; bottom: 80px;
    font-family: "Mrs Saint Delafield", cursive; font-size: 130px; line-height: 1;
  }
  .cover { justify-content: flex-start; }
  .cover h1 {
    position: relative; z-index: 1;
    font-weight: 700; font-size: 66px; line-height: 1.6;
    letter-spacing: 0.24em; margin-top: 150px;
  }
  .body { font-size: 40px; line-height: 1.8; letter-spacing: 0.14em; }
  .body h2 { font-weight: 700; font-size: 46px; letter-spacing: 0.12em; margin-bottom: 1.1em; line-height: 1.5; }
  .body p { margin-bottom: 1.05em; }
  .body p:last-child { margin-bottom: 0; }
  .body .en { letter-spacing: 0.02em; }
  .body .note { margin-top: 1.6em; font-size: 26px; color: var(--soft); letter-spacing: 0.1em; }
  .end .sign { left: auto; right: 80px; bottom: 70px; font-size: 120px; }
</style>
</head>
<body>

<!-- 封面：大標 4 行左右的短句；人物照放同資料夾 person.png（沒有人物就刪掉 .person） -->
<section class="slide cover">
  <h1>第一行短句<br>第二行短句<br>第三行短句<br>第四行短句</h1>
  <div class="person"></div>
  <div class="sign">Hanna</div>
</section>

<!-- 內頁：可選 h2 標題，段落用 p，換行用 br -->
<section class="slide"><div class="body">
  <h2>這一頁的觀點標題</h2>
  <p>第一段第一行，<br>第一段第二行。</p>
  <p>第二段。</p>
</div></section>

<!-- 最後一頁：收尾 + 儲存引導 + 免責 + 簽名 -->
<section class="slide end"><div class="body">
  <p>收尾的一句話。</p>
  <div class="save">
    <p class="t"><svg viewBox="0 0 20 24"><path d="M2 1h16v22l-8-6-8 6z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>先把這篇存起來</p>
    <p>下次＿＿＿＿時，<br>打開來，再＿＿＿＿。</p>
  </div>
  <p class="note">僅為個人觀點分享，不構成投資建議</p>
</div><div class="sign">Hanna</div></section>

<script>
  // 內容太長時自動縮小字級，確保每張都放得下
  // 每一頁上方加上依序編號的系列標
  document.querySelectorAll('.slide').forEach((slide, i) => {
    const tag = document.createElement('div');
    tag.className = 'series';
    tag.textContent = "HANNA'S READING NOTES · " + String(i + 1).padStart(2, '0');
    slide.prepend(tag);
  });
  document.fonts.ready.then(() => {
    document.querySelectorAll('.slide .body').forEach(b => {
      const slide = b.parentElement, max = slide.clientHeight - 320;
      let size = 40;
      while (b.scrollHeight > max && size > 30) { size -= 1; b.style.fontSize = size + 'px'; }
    });
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
